name: InfraMind Drift Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  inframind-audit:
    name: Check Architecture Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Trigger InfraMind Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering InfraMind Drift Audit..."
          
          # Extract repository information
          REPO_NAME="${{ github.repository }}"
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          
          # Send a manual scan request to the InfraMind API if a webhook isn't configured
          # Replace 'YOUR_PROJECT_ID' with the InfraMind Project ID and 'YOUR_API_KEY' with your user API key
          # curl -X POST "https://api.inframind.ai/api/projects/YOUR_PROJECT_ID/drift/scan" \
          #   -H "Authorization: Bearer YOUR_API_KEY" \
          #   -H "Content-Type: application/json"
          
          echo "Drift scan initiated."
          # Note: This action currently triggers the webhook and does not block the PR (exit 1) 
          # as per current configuration. InfraMind will post a comment directly on the PR with the score.
